<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TOKO FARIZ CELL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        }
        
        body {
            background: #0F4C5C;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        
        .login-box {
            background: white;
            border-radius: 40px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border: 3px solid #F18F01;
            text-align: center;
        }
        
        h1 {
            color: #0F4C5C;
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }
        
        .input-group label {
            display: block;
            font-weight: bold;
            color: #0F4C5C;
            margin-bottom: 8px;
            font-size: 16px;
        }
        
        .input-group input {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            border: 3px solid #CBD5E0;
            border-radius: 20px;
            outline: none;
            box-sizing: border-box;
        }
        
        .input-group input:focus {
            border-color: #F18F01;
        }
        
        .btn-login {
            background: #1E7A5E;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 18px;
            font-size: 20px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            border: 2px solid #0F4C5C;
            transition: transform 0.1s;
        }
        
        .btn-login:active {
            transform: scale(0.98);
        }
        
        .error-message {
            color: #E53E3E;
            margin-top: 15px;
            display: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🏠 TOKO FARIZ CELL</h1>
        <p class="subtitle">Masukkan password untuk melanjutkan</p>
        
        <div class="input-group">
            <label>🔑 Password</label>
            <input type="password" id="password" placeholder="Masukkan password" autofocus>
        </div>
        
        <button class="btn-login" onclick="login()">MASUK</button>
        
        <div id="errorMessage" class="error-message">Password salah! Coba lagi.</div>
    </div>
    
    <script>
        function login() {
            const password = document.getElementById('password').value;
            if (password === 'dedi123') {
                localStorage.setItem('tokofariz_auth', 'true');
                window.location.href = 'index.html';
            } else {
                document.getElementById('errorMessage').style.display = 'block';
            }
        }
        
        // Cek sudah login?
        if (localStorage.getItem('tokofariz_auth') === 'true') {
            window.location.href = 'index.html';
        }
        
        // Enter untuk login
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });
    </script>
</body>
</html>
