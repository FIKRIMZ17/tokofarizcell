<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>➕ Tambah Barang - TOKO FARIZ CELL</title>
    
    <script>
        if (localStorage.getItem('tokofariz_auth') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>
    
    <script type="module" src="data.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: #f0f2f5;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 20px;
        }
        .page-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .back-btn {
            background: #e2e8f0;
            border: 2px solid #0F4C5C;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 24px;
            color: #0F4C5C;
        }
        .page-title {
            color: #0F4C5C;
            font-size: 22px;
            font-weight: bold;
            flex: 1;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            color: #0F4C5C;
            margin-bottom: 8px;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            border: 2px solid #cbd5e0;
            border-radius: 10px;
            font-size: 16px;
        }
        .btn-simpan {
            background: #1E7A5E;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin: 20px 0;
        }
        .info-harga {
            background: #e6f0fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }
        .harga-besar {
            font-size: 32px;
            font-weight: bold;
            color: #F18F01;
        }
        .footer {
            text-align: center;
            color: #666;
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <a href="index.html" class="back-btn">←</a>
            <h1 class="page-title">➕ TAMBAH BARANG</h1>
        </div>

        <form id="formTambah">
            <div class="form-group">
                <label>📝 Nama Barang</label>
                <input type="text" id="nama" class="form-control" required>
            </div>

            <div class="form-group">
                <label>📁 Kategori</label>
                <select id="kategori" class="form-control" required>
                    <option value="Sembako">Sembako</option>
                    <option value="Makanan">Makanan</option>
                    <option value="Frozen Food">Frozen Food</option>
                    <option value="Rokok">Rokok</option>
                    <option value="RT">Perlampuan RT</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
            </div>

            <div class="form-group">
                <label>💰 Harga Modal</label>
                <input type="number" id="harga" class="form-control" required>
            </div>

            <div class="info-harga" id="infoHarga">
                <p>🔍 HARGA SATUAN</p>
                <p class="harga-besar" id="hargaSatuan">Rp 0</p>
            </div>

            <button type="submit" class="btn-simpan">💾 SIMPAN</button>
        </form>

        <div class="footer">
            <p>Input barang baru</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('formTambah');
        const hargaInput = document.getElementById('harga');
        const namaInput = document.getElementById('nama');
        const kategoriSelect = document.getElementById('kategori');
        const hargaSatuanSpan = document.getElementById('hargaSatuan');

        hargaInput.addEventListener('input', () => {
            if (hargaInput.value) {
                hargaSatuanSpan.textContent = 'Rp ' + parseInt(hargaInput.value).toLocaleString('id-ID');
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const barang = {
                nama: namaInput.value,
                kategori: kategoriSelect.value,
                modal: parseInt(hargaInput.value),
                tanggal: new Date().toISOString().split('T')[0]
            };

            try {
                const result = await window.tambahBarang(barang);
                if (result) {
                    alert('✅ Barang berhasil disimpan!');
                    form.reset();
                    hargaSatuanSpan.textContent = 'Rp 0';
                } else {
                    alert('❌ Gagal menyimpan');
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });
    </script>
</body>
</html>
