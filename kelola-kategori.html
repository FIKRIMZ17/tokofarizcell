<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>🏷️ Kelola Kategori - TOKO FARIZ CELL</title>
    
    <!-- CEK LOGIN -->
    <script>
        if (localStorage.getItem('tokofariz_auth') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>
    
    <!-- FIREBASE MODULE -->
    <script type="module" src="data.js"></script>
    
    <link rel="stylesheet" href="style.css">
    <style>
        .kategori-list {
            margin: 20px 0;
        }
        
        .kategori-item {
            background: white;
            border: 2px solid #E2E8F0;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .kategori-nama {
            font-weight: bold;
            color: #0F4C5C;
            font-size: 18px;
        }
        
        .kategori-info {
            font-size: 14px;
            color: #666;
            margin-left: 10px;
        }
        
        .kategori-aksi {
            display: flex;
            gap: 8px;
        }
        
        .kategori-aksi button {
            background: #E53E3E;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 8px 15px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .kategori-aksi button.edit {
            background: #F18F01;
        }
        
        .tambah-kategori {
            background: #E6F0FA;
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
            border: 2px solid #0F4C5C;
        }
        
        .tambah-kategori h3 {
            color: #0F4C5C;
            margin-bottom: 15px;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .input-group input {
            flex: 3;
            min-width: 200px;
            padding: 15px;
            border: 3px solid #CBD5E0;
            border-radius: 15px;
            font-size: 16px;
            outline: none;
        }
        
        .input-group input:focus {
            border-color: #F18F01;
        }
        
        .input-group button {
            flex: 1;
            min-width: 100px;
            background: #1E7A5E;
            color: white;
            border: none;
            border-radius: 15px;
            padding: 0 20px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            border: 2px solid #0F4C5C;
        }
        
        .input-group button:active {
            transform: scale(0.98);
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            background: #EDF2F7;
            border-radius: 25px;
            color: #666;
        }
        
        .btn-refresh {
            background: #F18F01;
            color: white;
            border: none;
            border-radius: 15px;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            border: 2px solid #0F4C5C;
        }
        
        .page-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .back-btn {
            background: #E2E8F0;
            border: 2px solid #0F4C5C;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 24px;
            color: #0F4C5C;
            font-weight: bold;
        }
        
        .page-title {
            color: #0F4C5C;
            font-size: 22px;
            font-weight: 600;
            flex: 1;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 18px;
            border-top: 2px solid #CBD5E0;
            color: #4A5568;
            font-size: 15px;
            font-weight: 500;
        }
        
        .success-message {
            background: #C6F6D5;
            color: #22543D;
            padding: 15px;
            border-radius: 15px;
            margin: 15px 0;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        
        .error-message {
            background: #FEEBC8;
            color: #7B341E;
            padding: 15px;
            border-radius: 15px;
            margin: 15px 0;
            text-align: center;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <a href="index.html" class="back-btn">◀</a>
            <h1 class="page-title">🏷️ KELOLA KATEGORI</h1>
            <div style="width: 45px;"></div>
        </div>

        <!-- PESAN -->
        <div id="successMessage" class="success-message"></div>
        <div id="errorMessage" class="error-message"></div>

        <!-- TOMBOL REFRESH -->
        <button class="btn-refresh" onclick="refreshKategori()">🔄 Refresh Kategori</button>

        <div class="tambah-kategori">
            <h3>➕ Tambah Kategori Baru</h3>
            <div class="input-group">
                <input type="text" id="namaKategoriBaru" placeholder="Contoh: Minuman, Mainan, Alat Tulis" autocomplete="off">
                <button onclick="tambahKategori()">Tambah</button>
            </div>
            <p style="font-size: 13px; color: #666; margin-top: 8px;">
                *Kategori akan muncul di halaman Tambah Barang
            </p>
        </div>

        <div id="kategoriContainer" class="kategori-list">
            <!-- Akan diisi JavaScript -->
        </div>

        <div class="footer">
            <p>Atur kategori sesuai warung Bapak</p>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        // ==================== FUNGSI TAMPILAN PESAN ====================
        function showSuccess(msg) {
            const el = document.getElementById('successMessage');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }
        
        function showError(msg) {
            const el = document.getElementById('errorMessage');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        // ==================== FUNGSI UTAMA ====================

        // PASTIKAN daftarKategori ADA
        if (!window.daftarKategori) {
            window.daftarKategori = [
                "Sembako",
                "Makanan",
                "Frozen Food",
                "Rokok",
                "RT",
                "Lainnya"
            ];
        }

        // FUNGSI REFRESH
        function refreshKategori() {
            tampilkanKategori();
        }

        // TAMPILKAN KATEGORI
        function tampilkanKategori() {
            const container = document.getElementById('kategoriContainer');
            
            if (!window.daftarKategori || window.daftarKategori.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p style="font-size: 48px;">🏷️</p>
                        <p>Belum ada kategori</p>
                        <p style="font-size: 14px; margin-top: 10px;">Klik tombol Tambah untuk membuat kategori baru</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            window.daftarKategori.forEach((kat, index) => {
                // Hitung jumlah barang di kategori ini
                const jumlahBarang = window.daftarBarang ? window.daftarBarang.filter(b => b.kategori === kat).length : 0;
                
                html += `
                    <div class="kategori-item">
                        <div>
                            <span class="kategori-nama">${kat}</span>
                            <span class="kategori-info">${jumlahBarang} barang</span>
                        </div>
                        <div class="kategori-aksi">
                            <button class="edit" onclick="editKategori(${index})">✏️ Edit</button>
                            <button onclick="hapusKategori(${index})">🗑️ Hapus</button>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // TAMBAH KATEGORI
        function tambahKategori() {
            const input = document.getElementById('namaKategoriBaru');
            const nama = input.value.trim();
            
            if (!nama) {
                showError('⚠️ Nama kategori tidak boleh kosong');
                input.focus();
                return;
            }
            
            // Cek duplikat
            if (window.daftarKategori.includes(nama)) {
                showError('⚠️ Kategori "' + nama + '" sudah ada');
                input.value = '';
                return;
            }
            
            // Tambah ke array
            window.daftarKategori.push(nama);
            
            // Simpan ke localStorage (backup)
            try {
                localStorage.setItem('tokofariz_kategori', JSON.stringify(window.daftarKategori));
            } catch (e) {}
            
            // Update tampilan
            tampilkanKategori();
            input.value = '';
            showSuccess('✅ Kategori "' + nama + '" berhasil ditambahkan');
        }
        
        // EDIT KATEGORI
        function editKategori(index) {
            const kategoriLama = window.daftarKategori[index];
            const baru = prompt('Ubah nama kategori:', kategoriLama);
            
            if (baru && baru.trim()) {
                const namaBaru = baru.trim();
                
                // Cek duplikat
                if (window.daftarKategori.includes(namaBaru) && namaBaru !== kategoriLama) {
                    showError('⚠️ Kategori "' + namaBaru + '" sudah ada');
                    return;
                }
                
                window.daftarKategori[index] = namaBaru;
                
                // Simpan ke localStorage
                try {
                    localStorage.setItem('tokofariz_kategori', JSON.stringify(window.daftarKategori));
                } catch (e) {}
                
                tampilkanKategori();
                showSuccess('✅ Kategori berhasil diubah');
            }
        }
        
        // HAPUS KATEGORI
        function hapusKategori(index) {
            const kategori = window.daftarKategori[index];
            
            // Cek apakah kategori digunakan
            const jumlahBarang = window.daftarBarang ? window.daftarBarang.filter(b => b.kategori === kategori).length : 0;
            
            let pesan = `Hapus kategori "${kategori}"?`;
            if (jumlahBarang > 0) {
                pesan = `Kategori "${kategori}" masih digunakan oleh ${jumlahBarang} barang.\n\nYakin hapus?\nBarang dengan kategori ini akan kehilangan kategorinya!`;
            }
            
            if (!confirm(pesan)) {
                return;
            }
            
            window.daftarKategori.splice(index, 1);
            
            // Simpan ke localStorage
            try {
                localStorage.setItem('tokofariz_kategori', JSON.stringify(window.daftarKategori));
            } catch (e) {}
            
            tampilkanKategori();
            showSuccess('✅ Kategori berhasil dihapus');
        }

        // ==================== REAL-TIME LISTENER ====================
        function setupRealtimeListener() {
            if (window.subscribeToBarang) {
                window.subscribeToBarang(function(data) {
                    console.log('🔄 Data barang berubah, refresh kategori');
                    tampilkanKategori();
                });
            }
        }

        // ==================== INIT ====================
        document.addEventListener('DOMContentLoaded', function() {
            // Load kategori dari localStorage
            try {
                const saved = localStorage.getItem('tokofariz_kategori');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        window.daftarKategori = parsed;
                    }
                }
            } catch (e) {}
            
            tampilkanKategori();
            setupRealtimeListener();
            
            // Enter untuk tambah
            document.getElementById('namaKategoriBaru').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    tambahKategori();
                }
            });
        });
    </script>
</body>
</html>
