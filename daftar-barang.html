<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>📋 Daftar Barang - TOKO FARIZ CELL</title>
    
    <!-- CEK LOGIN -->
    <script>
        if (localStorage.getItem('tokofariz_auth') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>
    
    <!-- FIREBASE MODULE -->
    <script type="module" src="data.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .kategori-group {
            margin-bottom: 25px;
        }
        
        .kategori-title {
            background: #0F4C5C;
            color: white;
            padding: 12px 18px;
            border-radius: 40px 40px 20px 20px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .kategori-count {
            background: #F18F01;
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 14px;
        }
        
        .barang-item {
            background: white;
            border: 2px solid #E2E8F0;
            border-radius: 18px;
            padding: 12px 15px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        
        .barang-info {
            flex: 1;
        }
        
        .barang-nama {
            font-weight: bold;
            color: #0F4C5C;
            font-size: 16px;
            margin-bottom: 4px;
        }
        
        .barang-detail {
            font-size: 13px;
            color: #666;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .barang-harga {
            background: #FEF5E7;
            padding: 8px 15px;
            border-radius: 30px;
            font-weight: bold;
            color: #F18F01;
            text-align: center;
            min-width: 120px;
            margin-right: 10px;
        }
        
        .barang-harga small {
            display: block;
            font-size: 11px;
            color: #666;
            font-weight: normal;
        }
        
        .barang-aksi {
            display: flex;
            gap: 8px;
        }
        
        .btn-aksi {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }
        
        .btn-aksi:active {
            transform: scale(0.9);
        }
        
        .btn-edit {
            background: #F18F01;
            color: white;
        }
        
        .btn-hapus {
            background: #E53E3E;
            color: white;
        }
        
        .search-box {
            margin-bottom: 20px;
        }
        
        .search-box input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 3px solid #0F4C5C;
            border-radius: 30px;
            outline: none;
        }
        
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .filter-select {
            flex: 2;
            min-width: 150px;
            padding: 12px;
            border: 3px solid #0F4C5C;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            color: #0F4C5C;
            background: white;
        }
        
        .btn-action {
            flex: 1;
            min-width: 120px;
            background: #1E7A5E;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid #0F4C5C;
        }
        
        .btn-action.orange {
            background: #F18F01;
        }
        
        .btn-action.red {
            background: #E53E3E;
        }
        
        .export-import-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: #EDF2F7;
            border-radius: 25px;
            color: #666;
        }
        
        .success-message {
            background: #C6F6D5;
            color: #22543D;
            padding: 15px;
            border-radius: 15px;
            margin: 15px 0;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        
        .error-message {
            background: #FEEBC8;
            color: #7B341E;
            padding: 15px;
            border-radius: 15px;
            margin: 15px 0;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
        }
        
        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        .modal-box {
            background: white;
            width: 90%;
            max-width: 500px;
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            transform: scale(0.9);
            transition: transform 0.2s;
            border: 3px solid #F18F01;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal-overlay.show .modal-box {
            transform: scale(1);
        }
        
        .modal-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px dashed #CBD5E0;
        }
        
        .modal-header-icon {
            background: #0F4C5C;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }
        
        .modal-header h2 {
            color: #0F4C5C;
            font-size: 22px;
            flex: 1;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-weight: bold;
            color: #0F4C5C;
            margin-bottom: 8px;
        }
        
        .form-control {
            width: 100%;
            padding: 15px;
            border: 3px solid #CBD5E0;
            border-radius: 15px;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        .form-control:focus {
            border-color: #F18F01;
            outline: none;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 15px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }
        
        .modal-btn.cancel {
            background: #E2E8F0;
            color: #666;
        }
        
        .modal-btn.save {
            background: #1E7A5E;
            color: white;
        }
        
        .page-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .back-btn {
            background: #E2E8F0;
            border: 2px solid #0F4C5C;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 24px;
            color: #0F4C5C;
            font-weight: bold;
        }
        
        .page-title {
            color: #0F4C5C;
            font-size: 22px;
            font-weight: 600;
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <a href="index.html" class="back-btn">◀</a>
            <h1 class="page-title">📋 DAFTAR BARANG</h1>
            <div style="width: 45px;"></div>
        </div>

        <!-- PESAN -->
        <div id="successMessage" class="success-message"></div>
        <div id="errorMessage" class="error-message"></div>

        <!-- SEARCH -->
        <div class="search-box">
            <input type="text" id="searchBarang" placeholder="Cari barang...">
        </div>

        <!-- FILTER KATEGORI -->
        <div class="filter-bar">
            <select id="filterKategori" class="filter-select">
                <option value="semua">Semua Kategori</option>
            </select>
        </div>

        <!-- EXPORT/IMPORT BUTTONS -->
        <div class="export-import-bar">
            <button class="btn-action" onclick="exportData()">💾 Backup JSON</button>
            <button class="btn-action orange" onclick="exportToExcel()">📊 Export Excel</button>
            
            <label for="importJson" class="btn-action" style="background: #F18F01; text-align: center; cursor: pointer;">📂 Restore JSON</label>
            <input type="file" id="importJson" accept=".json" style="display: none;" onchange="handleImportJson(this)">
            
            <label for="importExcel" class="btn-action" style="background: #E53E3E; text-align: center; cursor: pointer;">📗 Import Excel</label>
            <input type="file" id="importExcel" accept=".csv" style="display: none;" onchange="handleImportExcel(this)">
        </div>

        <!-- DAFTAR BARANG -->
        <div id="daftarContainer"></div>

        <div class="footer">
            <p>Semua barang yang pernah diinput</p>
        </div>
    </div>

    <!-- MODAL EDIT -->
    <div id="modalEdit" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-header-icon">✏️</div>
                <h2>Edit Barang</h2>
            </div>
            
            <form id="formEdit" onsubmit="event.preventDefault(); simpanEdit();">
                <input type="hidden" id="editId">
                
                <div class="form-group">
                    <label>Nama Barang</label>
                    <input type="text" id="editNama" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label>Kategori</label>
                    <select id="editKategori" class="form-control" required>
                        <option value="">-- Pilih Kategori --</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Harga Modal (Rp)</label>
                    <input type="number" id="editHarga" class="form-control" min="0" required>
                </div>
                
                <div class="form-group">
                    <label>Catatan / Keterangan</label>
                    <input type="text" id="editCatatan" class="form-control" placeholder="Contoh: 2 dus @ 40 bungkus">
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="modal-btn cancel" onclick="tutupModalEdit()">Batal</button>
                    <button type="submit" class="modal-btn save">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        // ==================== VARIABEL ====================
        let currentEditId = null;

        // ==================== FUNGSI TAMPILAN PESAN ====================
        function showSuccess(msg) {
            const el = document.getElementById('successMessage');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }
        
        function showError(msg) {
            const el = document.getElementById('errorMessage');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        // ==================== FUNGSI UTAMA ====================

        // LOAD FILTER KATEGORI
        function loadFilterKategori() {
            const select = document.getElementById('filterKategori');
            const kategoriSet = new Set();
            
            if (window.daftarBarang && window.daftarBarang.length > 0) {
                window.daftarBarang.forEach(barang => {
                    if (barang.kategori) kategoriSet.add(barang.kategori);
                });
            }
            
            const kategoriList = Array.from(kategoriSet).sort();
            
            select.innerHTML = '<option value="semua">Semua Kategori</option>';
            kategoriList.forEach(kat => {
                const option = document.createElement('option');
                option.value = kat;
                option.textContent = kat;
                select.appendChild(option);
            });
        }

        // TAMPILKAN DAFTAR BARANG
        function tampilkanDaftarBarang() {
            const keyword = document.getElementById('searchBarang').value.toLowerCase().trim();
            const filterKategori = document.getElementById('filterKategori').value;
            const container = document.getElementById('daftarContainer');
            
            if (!window.daftarBarang || window.daftarBarang.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p style="font-size: 48px;">📭</p>
                        <p>Belum ada data barang</p>
                        <p style="font-size: 14px; margin-top: 10px;">Klik Tambah Barang untuk memulai</p>
                        <a href="tambah.html" style="display: inline-block; margin-top: 15px; background: #1E7A5E; color: white; padding: 12px 25px; border-radius: 30px; text-decoration: none; font-weight: bold;">➕ Tambah Barang</a>
                    </div>
                `;
                return;
            }
            
            let barangFilter = [...window.daftarBarang];
            
            if (keyword) {
                barangFilter = barangFilter.filter(b => 
                    (b.nama && b.nama.toLowerCase().includes(keyword)) || 
                    (b.kategori && b.kategori.toLowerCase().includes(keyword)) ||
                    (b.agen && b.agen.toLowerCase().includes(keyword))
                );
            }
            
            if (filterKategori !== 'semua') {
                barangFilter = barangFilter.filter(b => b.kategori === filterKategori);
            }
            
            if (barangFilter.length === 0) {
                container.innerHTML = '<p style="text-align: center; padding: 40px; color: #666;">Tidak ada barang yang cocok</p>';
                return;
            }
            
            // Kelompokkan per kategori
            const kategoriMap = new Map();
            barangFilter.forEach(barang => {
                const kat = barang.kategori || 'Tanpa Kategori';
                if (!kategoriMap.has(kat)) {
                    kategoriMap.set(kat, []);
                }
                kategoriMap.get(kat).push(barang);
            });
            
            const kategoriSorted = Array.from(kategoriMap.keys()).sort();
            
            let html = '';
            kategoriSorted.forEach(kat => {
                const barangList = kategoriMap.get(kat);
                
                html += `
                    <div class="kategori-group">
                        <div class="kategori-title">
                            <span>${kat}</span>
                            <span class="kategori-count">${barangList.length}</span>
                        </div>
                `;
                
                barangList.forEach(barang => {
                    const hargaSatuan = barang.modal / barang.totalUnit;
                    const satuan = barang.isiSatuan || barang.jumlahSatuan || 'unit';
                    
                    html += `
                        <div class="barang-item" id="item-${barang.id}">
                            <div class="barang-info">
                                <div class="barang-nama">${barang.nama || 'Tanpa Nama'}</div>
                                <div class="barang-detail">
                                    <span>📦 ${barang.catatan || '-'}</span>
                                    <span>📅 ${formatTanggal(barang.tanggal)}</span>
                                    <span>🏪 ${barang.agen || '-'}</span>
                                </div>
                            </div>
                            
                            <div style="display: flex; align-items: center;">
                                <div class="barang-harga">
                                    ${formatRupiah(hargaSatuan)} <small>/${satuan}</small>
                                </div>
                                
                                <div class="barang-aksi">
                                    <button class="btn-aksi btn-edit" onclick="bukaModalEdit('${barang.id}')">✏️</button>
                                    <button class="btn-aksi btn-hapus" onclick="hapusBarang('${barang.id}')">🗑️</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                html += `</div>`;
            });
            
            container.innerHTML = html;
        }

        // ==================== FUNGSI EDIT ====================

        // BUKA MODAL EDIT
        function bukaModalEdit(id) {
            const barang = window.daftarBarang.find(b => b.id === id);
            if (!barang) {
                showError('Barang tidak ditemukan');
                return;
            }
            
            currentEditId = id;
            
            document.getElementById('editId').value = id;
            document.getElementById('editNama').value = barang.nama || '';
            document.getElementById('editHarga').value = barang.modal || 0;
            document.getElementById('editCatatan').value = barang.catatan || '';
            
            const selectKategori = document.getElementById('editKategori');
            selectKategori.innerHTML = '<option value="">-- Pilih Kategori --</option>';
            
            if (window.daftarKategori && window.daftarKategori.length > 0) {
                window.daftarKategori.forEach(kat => {
                    const option = document.createElement('option');
                    option.value = kat;
                    option.textContent = kat;
                    if (kat === barang.kategori) {
                        option.selected = true;
                    }
                    selectKategori.appendChild(option);
                });
            }
            
            document.getElementById('modalEdit').classList.add('show');
        }

        // TUTUP MODAL EDIT
        function tutupModalEdit() {
            document.getElementById('modalEdit').classList.remove('show');
            currentEditId = null;
        }

        // SIMPAN EDIT
        async function simpanEdit() {
            const id = document.getElementById('editId').value;
            const nama = document.getElementById('editNama').value.trim();
            const kategori = document.getElementById('editKategori').value;
            const harga = parseFloat(document.getElementById('editHarga').value);
            const catatan = document.getElementById('editCatatan').value.trim();
            
            if (!nama || !kategori || !harga) {
                showError('Nama, kategori, dan harga harus diisi');
                return;
            }
            
            const data = {
                nama: nama,
                kategori: kategori,
                modal: harga,
                catatan: catatan
            };
            
            const berhasil = await window.updateBarang(id, data);
            
            if (berhasil) {
                // Data otomatis update via listener, gak perlu refresh manual
                tutupModalEdit();
                showSuccess('✅ Barang berhasil diupdate');
            } else {
                showError('❌ Gagal mengupdate barang');
            }
        }

        // ==================== FUNGSI HAPUS ====================

        async function hapusBarang(id) {
            if (!confirm('Yakin hapus barang ini?')) return;
            
            const berhasil = await window.hapusBarang(id);
            if (berhasil) {
                showSuccess('✅ Barang berhasil dihapus');
                // Data otomatis update via listener
            } else {
                showError('❌ Gagal menghapus barang');
            }
        }

        // ==================== FUNGSI EXPORT/IMPORT ====================

        function handleImportJson(input) {
            if (input.files && input.files[0]) {
                window.importData(input.files[0]).then((result) => {
                    input.value = '';
                    showSuccess('✅ Import JSON berhasil');
                    // Data otomatis update via listener
                }).catch(err => {
                    showError('Gagal import: ' + err);
                    input.value = '';
                });
            }
        }

        function handleImportExcel(input) {
            if (input.files && input.files[0]) {
                window.importFromExcel(input.files[0]).then((result) => {
                    input.value = '';
                    showSuccess('✅ Import Excel berhasil');
                }).catch(err => {
                    showError('Gagal import Excel: ' + err);
                    input.value = '';
                });
            }
        }

        // ==================== FUNGSI BANTU ====================

        function formatRupiah(angka) {
            if (!angka) return 'Rp 0';
            return 'Rp ' + Math.round(angka).toLocaleString('id-ID');
        }

        function formatTanggal(tanggal) {
            if (!tanggal) return '-';
            try {
                const date = new Date(tanggal);
                return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
            } catch (e) {
                return '-';
            }
        }

        // ==================== REAL-TIME LISTENER (FIX BUG) ====================
        function setupRealtimeListener() {
            if (window.subscribeToBarang) {
                window.subscribeToBarang(function(data) {
                    console.log('🔄 Data barang berubah, refresh daftar barang');
                    loadFilterKategori();
                    tampilkanDaftarBarang();
                });
            } else {
                // Fallback polling
                setInterval(() => {
                    if (window.daftarBarang) {
                        loadFilterKategori();
                        tampilkanDaftarBarang();
                    }
                }, 3000);
            }
        }

        // ==================== INIT ====================
        document.addEventListener('DOMContentLoaded', function() {
            // Tunggu data.js load
            setTimeout(() => {
                loadFilterKategori();
                tampilkanDaftarBarang();
                setupRealtimeListener();
            }, 500);
            
            document.getElementById('searchBarang').addEventListener('keyup', function() {
                tampilkanDaftarBarang();
            });
            
            document.getElementById('filterKategori').addEventListener('change', function() {
                tampilkanDaftarBarang();
            });
        });
    </script>
</body>
</html>
